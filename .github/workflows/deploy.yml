name: Deploy InfraGuard AI

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: infraguard-ai
  REGISTRY: ""
  GCP_REGION: ""

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Resolve Artifact Registry settings
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          ARTIFACT_REGISTRY_REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
        run: |
          GCP_REGION="${GCP_REGION%-docker.pkg.dev}"
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "GCP_REGION=${GCP_REGION}" >> "$GITHUB_ENV"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build Docker images
        run: |
          docker build --no-cache -f agent/Dockerfile -t ${REGISTRY}/agent:latest .
          docker build --no-cache -f api/Dockerfile -t ${REGISTRY}/api:latest .

      - name: Push to Artifact Registry
        run: |
          docker push ${REGISTRY}/agent:latest
          docker push ${REGISTRY}/api:latest

      - name: Copy docker-compose.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml"
          target: "infraguad_ai/"

      - name: Deploy to GCE VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p infraguad_ai
            cd infraguad_ai
            export REGISTRY="${{ env.REGISTRY }}"
            cat > .env <<EOF
            INFRAGUARD_USERNAME=${{ secrets.INFRAGUARD_USERNAME }}
            INFRAGUARD_PASSWORD=${{ secrets.INFRAGUARD_PASSWORD }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            SESSION_COOKIE_SECURE=1
            INFRAGUARD_BIND_ADDRESS=127.0.0.1
            INFRAGUARD_PORT=8080
            OBSERVABILITY_NETWORK=infraguard-observability
            LLM_PROVIDER=gemini
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_MODEL=gemini-3.6-flash
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            ANTHROPIC_MODEL=claude-sonnet-5
            LOKI_URL=http://devplanner-loki:3100
            PROMETHEUS_URL=http://devplanner-prometheus:9090
            NTFY_TOPIC=${{ secrets.NTFY_TOPIC }}
            PROBE_URLS=http://devplanner-api:3001/health,http://devplanner-web:3000
            CROWDSEC_API_URL=http://devplanner-crowdsec:8080
            CROWDSEC_MACHINE_ID=infraguard
            CROWDSEC_MACHINE_PASSWORD=${{ secrets.CROWDSEC_MACHINE_PASSWORD }}
            RUNBOOKS_DIR=/app/runbooks
            ENABLE_DOCKER_MONITORING=1
            MONITORED_CONTAINERS=devplanner-api
            DEVPLANNER_CONTAINER_NAME=devplanner-api
            USE_LANGCHAIN_AGENT=1
            DB_PATH=/data/verdicts.db
            DOCKER_HOST=unix:///var/run/docker.sock
            HEARTBEAT_INTERVAL_SECONDS=120
            VERDICT_RETENTION_DAYS=30
            REGISTRY=${{ env.REGISTRY }}
            EOF
            if ! docker network inspect infraguard-observability >/dev/null 2>&1; then
              docker network create infraguard-observability
            fi
            gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet
            docker pull ${REGISTRY}/agent:latest
            docker pull ${REGISTRY}/api:latest
            docker compose down
            docker compose up -d
